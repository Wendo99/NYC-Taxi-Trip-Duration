[project]
name = "nyc-taxi-trip-duration"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    # Parquet engine for the OSRM route-distance checkpoints in
    # distance_utilities.add_route_distance(). Used via pandas.to_parquet,
    # so it never shows up as a direct import.
    "pyarrow>=16.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "folium>=0.17",
    "shapely>=2.0",
    "tqdm>=4.66",
    "requests>=2.32",
    "kaggle>=1.6",
]

[project.optional-dependencies]
# pandas ships no py.typed marker, so type checkers and IDEs fall back to
# whatever stubs they bundle. PyCharm's render read_csv's overloads without
# their defaults, producing a spurious "no overload matches" on the ordinary
# read_csv(path) call. pandas-stubs is the pandas team's official stub
# package and takes precedence over bundled stubs. mypy is what these stubs
# are checked with.
dev = ["jupyterlab", "ipykernel", "ruff", "pytest", "pandas-stubs", "mypy"]
# Optional: the xgboost wheel does not bundle the OpenMP runtime, so on macOS
# it additionally requires a system libomp (`brew install libomp`).
# Every other model in models_factory.py runs without this extra.
xgb = ["xgboost>=2.1"]

[tool.ruff]
# This codebase indents with 2 spaces, not the PEP 8 default of 4. Ruff needs
# telling, otherwise `ruff format` would reflow every file in the project.
indent-width = 2
line-length = 80
src = ["src", "tests"]

[tool.ruff.lint]
# E/F  pyflakes + pycodestyle   I  import order
# UP   pyupgrade                B  bugbear
# PL   pylint                   SIM  simplification
select = ["E", "F", "I", "UP", "B", "PL", "SIM"]

[tool.ruff.lint.pylint]
# Plotting and search helpers legitimately take a handful of knobs; the
# default of 5 flags ordinary signatures like plot_residual_heatmap.
max-args = 8
max-positional-args = 8

[tool.ruff.lint.per-file-ignores]
# Test names are deliberately long and descriptive.
# PLR2004: asserting against a literal is the entire point of a test — the
# rule would have us hide every expected value behind a named constant.
"tests/*" = ["E501", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"